<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
    @page { size: A4; margin: 15mm; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #F6F5F1; color: #15171C; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 13px; line-height: 1.5; }
    .vx-toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 14px; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #DAD8D0; font-size: 13px; }
    .vx-toolbar button { height: 38px; padding: 0 18px; border: 0; border-radius: 6px; background: #1F3FBF; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .vx-toolbar a { color: #1F3FBF; text-decoration: none; font-weight: 600; }
    .vx-toolbar span { color: #5E6470; }
    .vx-sheet { max-width: 210mm; margin: 16px auto; padding: 15mm; background: #fff; border: 1px solid #DAD8D0; border-radius: 6px; }
    .vx-title { border-bottom: 2px solid #15171C; padding-bottom: 8px; margin-bottom: 12px; }
    .vx-title-row { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .vx-title h1 { margin: 0; font-size: 20px; line-height: 1.3; }
    .vx-sub { color: #5E6470; font-size: 12px; margin-top: 2px; }
    .vx-codebox { border: 1.5px solid #15171C; border-radius: 4px; padding: 4px 12px; text-align: center; min-width: 90px; }
    .vx-codebox span { display: block; font-size: 10px; text-transform: uppercase; color: #5E6470; }
    .vx-codebox b { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; }
    .vx-fill { display: flex; gap: 24px; margin-top: 12px; }
    .vx-fill div { flex: 1; display: flex; gap: 6px; align-items: flex-end; white-space: nowrap; }
    .vx-fill i, .vx-short i { flex: 1; border-bottom: 1px dotted #15171C; min-width: 60px; height: 1em; }
    .vx-section { font-size: 15px; margin: 16px 0 6px; break-after: avoid; page-break-after: avoid; }
    .vx-passage { margin: 8px 0; padding: 8px 12px; background: #FAF9F6; border-left: 3px solid #BDBAB0; break-inside: avoid; page-break-inside: avoid; }
    .vx-q { margin: 0 0 10px; break-inside: avoid; page-break-inside: avoid; }
    .vx-qhead { break-after: avoid; }
    .vx-pts { color: #5E6470; font-size: 12px; }
    .vx-qtext p, .vx-opt p { margin: 0; }
    .vx-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; margin-top: 3px; }
    .vx-opts.vx-tf { grid-template-columns: 1fr; }
    .vx-opt { display: flex; gap: 5px; }
    .vx-opt b { flex: none; }
    .vx-short { margin-top: 6px; display: flex; gap: 6px; }
    .vx-end { text-align: center; margin-top: 14px; color: #5E6470; font-style: italic; }
    .vx-key table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .vx-key th { text-transform: uppercase; font-size: 12px; color: #5E6470; text-align: center; padding: 3px 6px; border-bottom: 1px solid #15171C; }
    .vx-key td { text-align: center; padding: 2px 6px; border-bottom: 1px solid #DAD8D0; font-family: 'JetBrains Mono', monospace; }
    .vx-key .vx-kfirst { text-align: left; }
    @media (max-width: 700px) { .vx-sheet { padding: 12px; margin: 0; border-radius: 0; } .vx-opts { grid-template-columns: 1fr; } }
    @media print {
        body { background: #fff; font-size: 12pt; }
        .vx-toolbar { display: none !important; }
        .vx-sheet { max-width: none; margin: 0; padding: 0; border: 0; border-radius: 0; }
        .vx-opts { grid-template-columns: 1fr 1fr; }
        .vx-key table { page-break-inside: auto; }
        .vx-key tr { break-inside: avoid; page-break-inside: avoid; }
    }
</style>
